version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"